<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Jadwal Pelajaran — SMK IT Bina Adzkia (TJKT)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#081226;
    --navy:#0f2044;
    --navy-mid:#17335f;
    --navy-line:#2a4a80;
    --paper:#eef2fb;
    --muted:#93a3c9;
    --gold:#e0b568;
    --gold-dim:#8a723f;
    --cyan:#3fd6c9;
    --cyan-dim:#1c5a56;
    --danger:#e0777a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:
      radial-gradient(circle at 14% -10%, rgba(63,214,201,0.10), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(224,181,104,0.10), transparent 45%),
      linear-gradient(180deg, var(--navy-deep), #050a17 92%);
    color:var(--paper);
    font-family:"Plus Jakarta Sans", "Segoe UI", sans-serif;
    overflow:hidden;
  }
  .board{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    padding: 1.6vh 2vw 1.2vh 2vw;
    gap:1.4vh;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.4vh 2vw;
    background:linear-gradient(120deg, var(--navy) 0%, var(--navy-mid) 100%);
    border:1px solid var(--navy-line);
    border-radius:18px;
    box-shadow:0 1.5vh 3vh rgba(0,0,0,0.35);
  }
  .brand{ display:flex; align-items:center; gap:1.4vw; }
  .brand img{ height:8vh; width:8vh; object-fit:contain; filter:drop-shadow(0 0.4vh 0.6vh rgba(0,0,0,0.5)); }
  .brand-text h1{
    font-family:"Outfit", sans-serif; font-weight:800;
    font-size:2.6vh; letter-spacing:0.02em; color:#fff; line-height:1.15;
  }
  .brand-text .sub{
    margin-top:0.5vh; font-size:1.55vh; color:var(--cyan);
    font-weight:600; letter-spacing:0.03em;
  }
  .brand-text .motto{
    margin-top:0.3vh; font-size:1.25vh; color:var(--muted); letter-spacing:0.08em;
  }
  .datetime{ text-align:right; }
  .clock{
    font-family:"Outfit", sans-serif; font-weight:700; font-size:5vh;
    color:var(--gold); letter-spacing:0.03em; font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .dateline{
    margin-top:0.8vh; font-size:1.7vh; color:var(--paper); font-weight:500;
  }

  /* ---------- MAIN CONTENT ---------- */
  .content{
    flex:1; display:flex; gap:1.4vw; min-height:0;
  }

  .schedule-panel{
    flex:1.55; display:flex; flex-direction:column; min-height:0;
    background:rgba(15,32,68,0.55);
    border:1px solid var(--navy-line);
    border-radius:18px;
    overflow:hidden;
  }
  .schedule-head{
    display:grid; grid-template-columns: 12% 29.33% 29.33% 29.34%;
    padding:1.3vh 1.6vw;
    background:linear-gradient(90deg, var(--navy-mid), var(--navy));
    font-family:"Outfit", sans-serif; font-weight:600;
    font-size:1.55vh; letter-spacing:0.04em; color:var(--muted);
    border-bottom:1px solid var(--navy-line);
  }
  .schedule-head span:first-child{ text-align:center; }
  .schedule-scroll{
    flex:1; overflow-y:auto; scroll-behavior:smooth;
  }
  .schedule-scroll::-webkit-scrollbar{ width:0; }

  .row{
    display:grid; grid-template-columns: 12% 29.33% 29.33% 29.34%;
    align-items:center;
    padding:0.95vh 1.6vw;
    border-bottom:1px solid rgba(255,255,255,0.06);
    transition:background .3s ease;
  }
  .row .jam{
    text-align:center; font-family:"Outfit",sans-serif; font-weight:700;
    font-size:1.7vh; color:var(--muted);
  }
  .row .jam small{ display:block; font-size:1.15vh; font-weight:500; color:var(--muted); margin-top:0.2vh; }
  .cell{ padding-right:1vw; }
  .cell .mapel{ font-size:1.62vh; font-weight:600; color:var(--paper); line-height:1.25; }
  .cell .guru{ font-size:1.28vh; color:var(--muted); margin-top:0.25vh; }
  .tag{
    display:inline-block; font-size:1.02vh; font-weight:700; letter-spacing:0.05em;
    padding:0.15vh 0.7vh; border-radius:5px; margin-left:0.6vh; vertical-align:1px;
    background:rgba(63,214,201,0.14); color:var(--cyan); border:1px solid rgba(63,214,201,0.4);
  }

  .row.common{
    background:rgba(224,181,104,0.06);
  }
  .row.common .mapel{
    grid-column: 2 / span 3;
    text-align:center; color:var(--gold); font-weight:700; font-size:1.6vh;
    letter-spacing:0.02em;
  }
  .row.common .cell{ grid-column: 2 / span 3; text-align:center; }

  .row.active{
    background:linear-gradient(90deg, rgba(224,181,104,0.20), rgba(224,181,104,0.06));
    box-shadow: inset 4px 0 0 var(--gold);
  }
  .row.active .jam{ color:var(--gold); }
  .row.active .mapel{ color:#fff; }

  /* ---------- SIDE PANEL ---------- */
  .now-panel{ flex:1; display:flex; flex-direction:column; gap:1.4vh; min-height:0; }

  .now-card{
    flex:1.35; min-height:0; overflow:hidden;
    background:linear-gradient(160deg, var(--navy-mid), var(--navy));
    border:1px solid var(--gold-dim);
    border-radius:18px; padding:1.8vh 1.6vw;
    display:flex; flex-direction:column; gap:1vh;
  }
  .now-label{
    font-family:"Outfit",sans-serif; font-weight:700; font-size:1.5vh;
    letter-spacing:0.12em; color:var(--gold);
  }
  .now-headline{
    font-family:"Outfit",sans-serif; font-weight:700; font-size:2.4vh; color:#fff;
    line-height:1.2;
  }
  .now-classes{ display:flex; flex-direction:column; gap:0.9vh; margin-top:0.4vh; overflow-y:auto; }
  .now-classes::-webkit-scrollbar{ width:0; }
  .klas-item{
    display:flex; align-items:center; gap:1vw;
    background:rgba(255,255,255,0.05);
    border-radius:10px; padding:0.9vh 1vw;
  }
  .klas-badge{
    font-family:"Outfit",sans-serif; font-weight:800; font-size:1.5vh;
    color:var(--navy-deep); background:var(--cyan);
    border-radius:7px; padding:0.5vh 0.9vh; min-width:4.4vh; text-align:center;
  }
  .klas-info .mapel{ font-size:1.55vh; font-weight:600; color:#fff; line-height:1.2; }
  .klas-info .guru{ font-size:1.2vh; color:var(--muted); margin-top:0.15vh; }

  .next-card{
    flex:1; min-height:0;
    background:rgba(15,32,68,0.55);
    border:1px solid var(--navy-line);
    border-radius:18px; padding:1.7vh 1.6vw;
    display:flex; flex-direction:column; justify-content:center; gap:0.7vh;
  }
  .next-label{
    font-family:"Outfit",sans-serif; font-weight:700; font-size:1.4vh;
    letter-spacing:0.12em; color:var(--cyan);
  }
  .next-headline{ font-size:1.9vh; font-weight:600; color:var(--paper); line-height:1.3; }
  .next-countdown{
    font-family:"Outfit",sans-serif; font-weight:700; font-size:2.6vh;
    color:var(--gold); font-variant-numeric:tabular-nums; margin-top:0.2vh;
  }

  /* ---------- FOOTER ---------- */
  .ticker{
    padding:1vh 2vw; text-align:center;
    background:linear-gradient(120deg, var(--navy), var(--navy-mid));
    border:1px solid var(--navy-line); border-radius:14px;
    font-family:"Outfit",sans-serif; font-weight:600; font-size:1.5vh;
    letter-spacing:0.28em; color:var(--muted);
  }

  /* ---------- FULLSCREEN STATE MESSAGES ---------- */
  .state-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.4vh; text-align:center;
  }
  .state-screen .icon{ font-size:8vh; }
  .state-screen h2{ font-family:"Outfit",sans-serif; font-size:3.2vh; font-weight:700; color:#fff; }
  .state-screen p{ font-size:1.8vh; color:var(--muted); max-width:60vw; }
  .state-screen .clock-big{
    font-family:"Outfit",sans-serif; font-weight:700; font-size:7vh; color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
</style>
</head>

const HARI_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function toMinutes(str){
  const [h,m] = str.split(".").map(Number);
  return h*60+m;
}
function fmtCountdown(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function isPraktik(mapel){
  return /Praktik|Produktif/i.test(mapel);
}

function renderStateScreen(icon, title, desc, showClock){
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="state-screen">
      <div class="icon">${icon}</div>
      ${showClock ? `<div class="clock-big" id="bigClock">00:00:00</div>` : ""}
      <h2>${title}</h2>
      <p>${desc}</p>
    </div>`;
}

function buildRows(dayName){
  const rows = document.getElementById("scheduleRows");
  rows.innerHTML = "";
  SCHEDULE[dayName].forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "row " + item.type;
    div.dataset.idx = idx;

    const jam = document.createElement("div");
    jam.className = "jam";
    jam.innerHTML = (item.type==="lesson" ? "Jam "+item.jam : "—") + `<small>${item.t[0]}–${item.t[1]}</small>`;
    div.appendChild(jam);

    if(item.type === "common"){
      const cell = document.createElement("div");
      cell.className = "mapel";
      cell.textContent = (item.icon ? item.icon+"  " : "") + item.label;
      div.appendChild(cell);
    } else {
      ["x","xi","xii"].forEach(k=>{
        const c = item[k];
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<div class="mapel">${c.m}${isPraktik(c.m) ? '<span class="tag">PRAKTIK</span>' : ''}</div><div class="guru">${c.g}</div>`;
        div.appendChild(cell);
      });
    }
    rows.appendChild(div);
  });
}

function updateNowNext(dayName, nowMin){
  const items = SCHEDULE[dayName];
  let activeIdx = -1, nextIdx = -1;
  for(let i=0;i<items.length;i++){
    const [s,e] = items[i].t.map(toMinutes);
    if(nowMin>=s && nowMin<e){ activeIdx = i; }
    if(s>nowMin && nextIdx===-1){ nextIdx = i; }
  }

  // highlight
  document.querySelectorAll(".row").forEach(r=>r.classList.remove("active"));
  if(activeIdx>=0){
    const activeRow = document.querySelector(`.row[data-idx="${activeIdx}"]`);
    if(activeRow){
      activeRow.classList.add("active");
      activeRow.scrollIntoView({block:"center", behavior:"smooth"});
    }
  }

  const nowCard = document.getElementById("nowCard");
  const nextCard = document.getElementById("nextCard");

  if(activeIdx>=0){
    const item = items[activeIdx];
    if(item.type==="lesson"){
      nowCard.innerHTML = `
        <div class="now-label">SEDANG BERLANGSUNG — JAM KE-${item.jam}</div>
        <div class="now-headline">${item.t[0]} – ${item.t[1]}</div>
        <div class="now-classes">
          ${["X","XI","XII"].map((label,i)=>{
            const c = item[["x","xi","xii"][i]];
            return `<div class="klas-item">
              <div class="klas-badge">${label}</div>
              <div class="klas-info">
                <div class="mapel">${c.m}${isPraktik(c.m) ? '<span class="tag">PRAKTIK</span>' : ''}</div>
                <div class="guru">${c.g}</div>
              </div>
            </div>`;
          }).join("")}
        </div>`;
    } else {
      nowCard.innerHTML = `
        <div class="now-label">SEDANG BERLANGSUNG</div>
        <div class="now-headline">${item.icon ? item.icon+" " : ""}${item.label}</div>
        <div class="now-classes"><div class="klas-item"><div class="klas-info"><div class="guru">${item.t[0]} – ${item.t[1]} • Seluruh Kelas</div></div></div></div>`;
    }
  } else {
    nowCard.innerHTML = `
      <div class="now-label">STATUS</div>
      <div class="now-headline">Di luar sesi terjadwal</div>`;
  }

  if(nextIdx>=0){
    const item = items[nextIdx];
    const startMin = toMinutes(item.t[0]);
    const remain = (startMin - nowMin)*60 - (new Date().getSeconds());
    let desc;
    if(item.type==="lesson"){
      desc = `Jam ke-${item.jam} pukul ${item.t[0]} — X: ${item.x.m} · XI: ${item.xi.m} · XII: ${item.xii.m}`;
    } else {
      desc = `${item.icon ? item.icon+" " : ""}${item.label}, pukul ${item.t[0]}`;
    }
    nextCard.innerHTML = `
      <div class="next-label">SELANJUTNYA</div>
      <div class="next-headline">${desc}</div>
      <div class="next-countdown">${fmtCountdown(Math.max(remain,0))}</div>`;
  } else {
    nextCard.innerHTML = `
      <div class="next-label">SELANJUTNYA</div>
      <div class="next-headline">Kegiatan hari ini telah selesai</div>`;
  }
}

let currentDayRendered = null;

function tick(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");
  const clockStr = `${hh}:${mm}:${ss}`;

  const clockEl = document.getElementById("clock");
  if(clockEl) clockEl.textContent = clockStr;
  const bigClockEl = document.getElementById("bigClock");
  if(bigClockEl) bigClockEl.textContent = clockStr;

  const dateEl = document.getElementById("dateline");
  const dayIdx = now.getDay();
  const dayName = HARI_ID[dayIdx];
  const dateStr = `${dayName}, ${now.getDate()} ${BULAN_ID[now.getMonth()]} ${now.getFullYear()}`;
  if(dateEl) dateEl.textContent = dateStr;

  const ticker = document.getElementById("ticker");

  if(!SCHEDULE[dayName]){
    // Sabtu / Minggu
    if(currentDayRendered !== dayName){
      renderStateScreen("🌤️", "Selamat Akhir Pekan!", "Tidak ada kegiatan belajar mengajar hari ini. Jadwal pelajaran akan kembali pada hari Senin.", true);
      if(ticker) ticker.textContent = "SELAMAT BERISTIRAHAT • SAMPAI JUMPA SENIN";
      currentDayRendered = dayName;
    }
    return;
  }

  const nowMin = now.getHours()*60 + now.getMinutes();
  const items = SCHEDULE[dayName];
  const firstStart = toMinutes(items[0].t[0]);
  const lastEnd = toMinutes(items[items.length-1].t[1]);

  if(nowMin < firstStart){
    if(currentDayRendered !== dayName+"-before"){
      renderStateScreen("⏳", "Sekolah Akan Segera Dimulai", `Kegiatan belajar mengajar hari ${dayName} dimulai pukul ${items[0].t[0]}.`, true);
      if(ticker) ticker.textContent = "PERSIAPAN BELAJAR • SEKOLAH SEGERA DIMULAI";
      currentDayRendered = dayName+"-before";
    }
    return;
  }

  if(nowMin >= lastEnd){
    if(currentDayRendered !== dayName+"-after"){
      renderStateScreen("🏠", "Kegiatan Belajar Hari Ini Selesai", "Terima kasih, sampai jumpa pada jadwal pelajaran berikutnya.", true);
      if(ticker) ticker.textContent = "SAMPAI JUMPA BESOK • BELAJAR • DISIPLIN • BERAKHLAK";
      currentDayRendered = dayName+"-after";
    }
    return;
  }

  if(currentDayRendered !== dayName+"-active"){
    document.getElementById("mainContent").innerHTML = `
      <section class="schedule-panel">
        <div class="schedule-head">
          <span>Jam</span><span>Kelas X</span><span>Kelas XI</span><span>Kelas XII</span>
        </div>
        <div class="schedule-scroll" id="scheduleScroll">
          <div id="scheduleRows"></div>
        </div>
      </section>
      <aside class="now-panel">
        <div class="now-card" id="nowCard"></div>
        <div class="next-card" id="nextCard"></div>
      </aside>`;
    buildRows(dayName);
    currentDayRendered = dayName+"-active";
  }

  updateNowNext(dayName, nowMin);
  if(ticker) ticker.textContent = "BELAJAR • DISIPLIN • BERAKHLAK — SMK IT BINA ADZKIA • JURUSAN TJKT";
}

tick();
setInterval(tick, 1000);
</script>
